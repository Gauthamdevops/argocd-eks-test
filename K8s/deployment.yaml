apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app1
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: sample-app
        image: 969682547877.dkr.ecr.ap-south-1.amazonaws.com/eks-git:v5
        ports:
        - containerPort: 3000
